<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf6fc">
  <meta name="description" content="子どもと遊べる、シンプルなミニゲーム。一筆書きとブロックのパズル。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="わくわく">
  <title>わくわくミニゲーム</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="home">
    <header class="home-heading">
      <p class="eyebrow"><span aria-hidden="true">✦</span> あそんで、ひらめこう。</p>
      <h1><span>わくわく</span>ミニゲーム</h1>
      <p>ちいさな「できた！」を、いっぱい。</p>
    </header>
    <h2 class="section-title">どれで あそぶ？</h2>
    <div class="games" aria-label="ゲームをえらぶ">
      <a class="game-card" href="./games/hitofude/difficulty.html">
        <span class="game-art" aria-hidden="true">
          <svg viewBox="0 0 120 120" fill="none">
            <path d="M18 96H42V74H65" stroke="#758ed0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="96" r="6" fill="#758ed0"/>
            <circle cx="73" cy="46" r="32" fill="#ffedbb"/>
            <path d="M73 23a23 23 0 0 0-15 40c5 4 6 7 6 12h18c0-5 1-8 6-12a23 23 0 0 0-15-40Z" fill="#ffd66b" stroke="#ba8b26" stroke-width="3"/>
            <path d="m64 47 9 8 9-8M73 55v20" stroke="#fffdf5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="63" y="75" width="20" height="11" rx="4" fill="#4c657d"/>
            <path d="M73 9V4M99 24l5-4M103 47h6M46 24l-5-4" stroke="#ba8b26" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="game-copy">
          <span class="game-tag">ひらめきパズル</span>
          <span class="game-title">ピカッとひとふで</span>
          <span class="game-description">でんちから、ぜんぶのマスを<br>つないでみよう！</span>
          <span class="play-label">あそぶ <span aria-hidden="true">→</span></span>
        </span>
      </a>
      <a class="game-card" href="./games/block-fit/difficulty.html">
        <span class="game-art" aria-hidden="true">
          <svg viewBox="0 0 120 120" fill="none">
            <rect x="8" y="36" width="70" height="70" rx="14" fill="#dce9ef"/>
            <g stroke="#42536b" stroke-width="2.5">
              <rect x="14" y="42" width="27" height="27" rx="6" fill="#78c5e5"/><rect x="14" y="73" width="27" height="27" rx="6" fill="#78c5e5"/>
              <rect x="45" y="73" width="27" height="27" rx="6" fill="#8ec9a2"/>
              <rect x="60" y="14" width="27" height="27" rx="6" fill="#f4a35d"/><rect x="91" y="14" width="27" height="27" rx="6" fill="#f4a35d"/>
              <rect x="60" y="45" width="27" height="27" rx="6" fill="#f4a35d"/>
            </g>
            <path d="m91 89 5 5 12-13" stroke="#65a78d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="m33 14 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#f4d463"/>
          </svg>
        </span>
        <span class="game-copy">
          <span class="game-tag">かたちのパズル</span>
          <span class="game-title">ブロックぴったり</span>
          <span class="game-description">カラフルなブロックを<br>ぴったり はめてみよう！</span>
          <span class="play-label">あそぶ <span aria-hidden="true">→</span></span>
        </span>
      </a>
    </div>
    <p class="home-note">ゆっくりでも、だいじょうぶ。<br>じぶんのペースで あそぼう。</p>
  </main>
  <noscript><p class="noscript">ゲームで遊ぶにはJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
