<body>
  <h1>ゲームロジックの検証</h1>
  <p>実際のゲームと同じJavaScriptで、移動のルールと、自動生成した両難易度の各5000問を確認します。</p>
  <h2>ピカッとひとふで</h2>
  <pre id="results">検証中…</pre>
  <h2>ブロックぴったり</h2>
  <p>両難易度を各1000問生成し、連結形状・回転なしの解答・配置・クリア・リセットを確認します。</p>
  <pre id="block-results">検証中…</pre>
  <h2>レールつなぎ</h2>
  <p>両難易度を各1000問生成し、接続口・回転だけの解答・難易度・別解を確認します。</p>
  <pre id="rail-results">検証中…</pre>
  <h2>キューブぴったり</h2>
  <p>両難易度を各1000問生成し、独立した配置・レイ判定で正解一意性・視認性・面の重なりを確認します。</p>
  <pre id="cube-results">検証中…</pre>
