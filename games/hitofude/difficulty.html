<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf7">
  <title>むずかしさをえらぶ | ピカッとひとふで</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../style.css">
  <script src="../../app.js" defer></script>
</head>
<body>
  <main class="difficulty-screen">
    <a class="back-link" href="../../index.html"><span aria-hidden="true">←</span> ホームにもどる</a>
    <header class="difficulty-heading">
      <p class="eyebrow"><span aria-hidden="true">✦</span> ピカッとひとふで</p>
      <h1>どっちで あそぶ？</h1>
      <p>でんちから、ぜんぶのマスを つなごう。</p>
    </header>
    <div class="difficulty-options" aria-label="むずかしさをえらぶ">
      <a class="difficulty-card" href="./index.html?difficulty=easy">
        <svg class="level-art" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="70" height="70" rx="16" fill="#fff"/>
          <path d="M17 18h19v18h19v18H17" stroke="#65a78d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="17" cy="18" r="5" fill="#4b7265"/><circle cx="17" cy="54" r="7" fill="#ffcf52"/>
        </svg>
        <span class="difficulty-copy"><span class="difficulty-name">かんたん</span><span class="difficulty-description">ちいさなマスで<br>ゆっくり</span></span>
        <span class="difficulty-arrow" aria-hidden="true">→</span>
      </a>
      <a class="difficulty-card difficulty-card--hard" href="./index.html?difficulty=hard">
        <svg class="level-art" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="70" height="70" rx="16" fill="#fff"/>
          <path d="M36 36h18V18H18v36h36" stroke="#d49b36" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="36" cy="36" r="5" fill="#8b672e"/><circle cx="54" cy="54" r="7" fill="#ffcf52"/>
        </svg>
        <span class="difficulty-copy"><span class="difficulty-name">むずかしい</span><span class="difficulty-description">おおきなマスで<br>ひとくふう</span></span>
        <span class="difficulty-arrow" aria-hidden="true">→</span>
      </a>
    </div>
    <p class="home-note">なんどでも、やりなおせるよ。</p>
  </main>
</body>
</html>
