<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf6fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>キューブぴったり | わくわくミニゲーム</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="./style.css">
  <script src="../../app.js" defer></script>
  <script src="./renderer.js" defer></script>
  <script src="./generator.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="cube-screen">
    <header class="game-header">
      <div class="toolbar">
        <a class="icon-button" href="../../index.html" aria-label="ホームへもどる" title="ホームへもどる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M6 9v11h5v-6h2v6h5V9"/></svg>
        </a>
        <h1>キューブぴったり</h1>
        <button class="icon-button reset-button" id="reset" type="button" aria-label="やりなおし" title="おなじ もんだいを やりなおす">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7a9 9 0 1 0 1 8M20 3v5h-5"/></svg>
          <span class="reset-label">やりなおし</span>
        </button>
      </div>
      <div class="stage-meta">
        <a id="difficulty-label" class="difficulty-chip" href="./difficulty.html">かんたん</a>
        <p id="stage-number" class="stage-number" aria-label="もんだい">もんだい 1</p>
      </div>
      <div id="set-progress" class="set-progress" role="progressbar"
        aria-label="10もんのうち クリアした かず" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"></div>
    </header>
    <section class="play-area" aria-label="パズル">
      <div class="scene-wrap">
        <svg id="cube-scene" role="img" aria-label="かけた キューブ"></svg>
        <div id="clear-overlay" class="clear-overlay" hidden>
          <div class="clear-card" role="dialog" aria-labelledby="clear-title">
            <h2 id="clear-title">できた！</h2>
            <button id="next" class="next-button" type="button">つぎへ</button>
          </div>
        </div>
      </div>
      <h2 class="choice-heading">ぴったり はまるのは どれ？</h2>
      <div id="cube-choices" class="cube-choices" role="group" aria-label="ブロックを えらぶ"></div>
      <p id="hint" class="hint" aria-live="polite">ぴったり はまるのは どれ？</p>
    </section>
    <div id="set-complete" class="set-complete" hidden>
      <div class="set-complete-card" role="dialog" aria-modal="true" aria-labelledby="set-complete-title">
        <div class="set-complete-trophy" aria-hidden="true">🏆</div>
        <h2 id="set-complete-title">ぜんぶ できた！</h2>
        <p>10もん クリア！ すごいね！</p>
        <button id="set-play-again" class="set-again" type="button">もう10もん あそぶ</button>
        <a class="set-home" href="../../index.html">ホームにもどる</a>
      </div>
    </div>
    <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <noscript><p class="noscript">ゲームで遊ぶにはJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
