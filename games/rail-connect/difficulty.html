<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf7">
  <title>むずかしさをえらぶ | レールつなぎ</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../style.css">
  <script src="../../app.js" defer></script>
</head>
<body>
  <main class="difficulty-screen">
    <a class="back-link" href="../../index.html"><span aria-hidden="true">←</span> ホームにもどる</a>
    <header class="difficulty-heading">
      <p class="eyebrow"><span aria-hidden="true">✦</span> レールつなぎ</p>
      <h1>どっちで あそぶ？</h1>
      <p>レールを くるくる、でんしゃを はしらせよう。</p>
    </header>
    <div class="difficulty-options" aria-label="むずかしさをえらぶ">
      <a class="difficulty-card" href="./index.html?difficulty=easy">
        <svg class="level-art" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="70" height="70" rx="16" fill="#fff"/>
          <path d="M15 54V34Q15 18 36 18H56" stroke="#edb24c" stroke-width="14" stroke-dasharray="4 9"/>
          <path d="M15 54V34Q15 18 36 18H56" stroke="#467aa4" stroke-width="8"/>
          <path d="M15 54V34Q15 18 36 18H56" stroke="#fff" stroke-width="3"/>
        </svg>
        <span class="difficulty-copy"><span class="difficulty-name">かんたん</span><span class="difficulty-description">みじかいレールで<br>ゆっくり</span></span>
        <span class="difficulty-arrow" aria-hidden="true">→</span>
      </a>
      <a class="difficulty-card difficulty-card--hard" href="./index.html?difficulty=hard">
        <svg class="level-art" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="70" height="70" rx="16" fill="#fff"/>
          <path d="M14 54H36Q54 54 54 36V18H18" stroke="#edb24c" stroke-width="14" stroke-dasharray="4 9"/>
          <path d="M14 54H36Q54 54 54 36V18H18" stroke="#467aa4" stroke-width="8"/>
          <path d="M14 54H36Q54 54 54 36V18H18" stroke="#fff" stroke-width="3"/>
        </svg>
        <span class="difficulty-copy"><span class="difficulty-name">むずかしい</span><span class="difficulty-description">ながいレールで<br>ひとくふう</span></span>
        <span class="difficulty-arrow" aria-hidden="true">→</span>
      </a>
    </div>
    <p class="home-note">なんどでも、やりなおせるよ。</p>
  </main>

</html>
