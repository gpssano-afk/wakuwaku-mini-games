<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf7">
  <title>むずかしさをえらぶ | ブロックぴったり</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../style.css">
  <script src="../../app.js" defer></script>
</head>
<body>
  <main class="difficulty-screen">
    <a class="back-link" href="../../index.html"><span aria-hidden="true">←</span> ホームにもどる</a>
    <header class="difficulty-heading">
      <p class="eyebrow"><span aria-hidden="true">✦</span> ブロックぴったり</p>
      <h1>どっちで あそぶ？</h1>
      <p>ブロックを はめて、ぴったり うめよう。</p>
    </header>
    <div class="difficulty-options" aria-label="むずかしさをえらぶ">
      <a class="difficulty-card" href="./index.html?difficulty=easy">
        <svg class="level-art" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="70" height="70" rx="16" fill="#fff"/>
          <rect x="14" y="14" width="21" height="21" rx="4" fill="#8ec9a2"/><rect x="37" y="14" width="21" height="21" rx="4" fill="#8ec9a2"/>
          <rect x="14" y="37" width="21" height="21" rx="4" fill="#f4a35d"/><rect x="37" y="37" width="21" height="21" rx="4" fill="#f4a35d"/>
        </svg>
        <span class="difficulty-copy"><span class="difficulty-name">かんたん</span><span class="difficulty-description">おおきなブロックで<br>ゆっくり</span></span>
        <span class="difficulty-arrow" aria-hidden="true">→</span>
      </a>
      <a class="difficulty-card difficulty-card--hard" href="./index.html?difficulty=hard">
        <svg class="level-art" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="70" height="70" rx="16" fill="#fff"/>
          <path d="M14 14h22v44H14Z" fill="#b7a0df"/><rect x="38" y="36" width="21" height="22" rx="4" fill="#b7a0df"/>
          <rect x="38" y="14" width="21" height="20" rx="4" fill="#f4d463"/>
        </svg>
        <span class="difficulty-copy"><span class="difficulty-name">むずかしい</span><span class="difficulty-description">いろんなかたちで<br>ひとくふう</span></span>
        <span class="difficulty-arrow" aria-hidden="true">→</span>
      </a>
    </div>
    <p class="home-note">なんどでも、やりなおせるよ。</p>
  </main>
</body>
</html>
