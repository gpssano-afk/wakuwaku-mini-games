<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf6fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ブロックぴったり | わくわくミニゲーム</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="./style.css">
  <script src="../../app.js" defer></script>
  <script src="./generator.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="block-screen">
    <header class="game-header">
      <div class="toolbar">
        <a class="icon-button" href="../../index.html" aria-label="ホームへもどる" title="ホームへもどる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M6 9v11h5v-6h2v6h5V9"/></svg>
        </a>
        <h1>ブロックぴったり</h1>
        <button class="icon-button" id="reset" type="button" aria-label="リセット" title="リセット">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7a9 9 0 1 0 1 8M20 3v5h-5"/></svg>
        </button>
      </div>
      <p class="subtitle">ブロックで ぴったり うめよう！</p>
      <div class="stage-meta">
        <a id="difficulty-label" class="difficulty-chip" href="./difficulty.html">かんたん</a>
        <p id="stage-number" class="stage-number" aria-label="もんだい">もんだい 1</p>
      </div>
    </header>
    <section class="play-area" aria-label="パズル">
      <div class="board-wrap">
        <div id="block-board" role="group" aria-label="ブロックを はめる ばんめん"></div>
        <div id="clear-overlay" class="clear-overlay" hidden>
          <div class="clear-card" role="dialog" aria-labelledby="clear-title">
            <div class="clear-spark" aria-hidden="true">✦</div>
            <h2 id="clear-title">できた！</h2>
            <button id="next" class="next-button" type="button">つぎへ</button>
          </div>
        </div>
      </div>
      <p id="tray-title" class="tray-title">ブロックおきば</p>
      <div id="piece-tray" class="piece-tray" aria-label="まだ はめていない ブロック"></div>
      <p id="hint" class="hint">ブロックを もって はめよう！</p>
      <p class="tray-note">はめた ブロックも うごかせるよ。<br>したに もどしても だいじょうぶ。</p>
    </section>
    <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <noscript><p class="noscript">ゲームで遊ぶにはJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
